# Keyboard layers: hold a layer's key (before the " : ") and press another.
# `kb` builds them for Keys (keys/keys.json), Karabiner (karabiner.edn) and
# Hammerspoon, and refuses a key, app, mode or hs: event that goes nowhere.
#
# A key's value:
#   'sc.p'           keys: modifiers before the dot (c ⌘, s ⇧, o ⌥, t ⌃,
#                    f fn; q r e w the right-hand ones), then the key
#   'c.k rtn'        keys one after another; '"text"' types it; a ++ b joins
#   'app: obsidian'  open or bring forward; 'focus: mail' (Keys) does it the
#                    Open layer's way; 'raycast://…' opens a link;
#                    'alfred: trigger, workflow'; 'menu: Process, Item, Menu'
#   'hs: Tab.next'   a Hammerspoon event (init.lua's urlEvents)
#   hammerspoon      the layer's Hammerspoon mode (Modes/<Label>.lua) does it
#   dictate          hold to talk, let go to type it (Keys only)
#   chrome: … ide: … default: …   by app (names from config/apps.yml)
#   blank or null    free: not in the layer, so the key types as itself
# A `- all` layer (or all-left, all-right) gives every key to its Hammerspoon
# mode, except a map of overrides after it (blank there: free).
# Short names: qt ' · prd . · sb space · rtn return · dlt delete · ltS rtS
# shifts · caps · esc · lt rt up dn arrows · cln :

'caps : Hyper':
    y: hammerspoon
    u: hammerspoon
    i: hammerspoon
    o: hammerspoon
    p: 'soc.p' # Alfred clipboard
    '[': # Command Palette
        anybox: 'c.k'
        ide: 'sc.p'
        obsidian: 'c.p'
        warp: 'c.p'
        solo: 'c.k'
        default: 'alfred: search, com.tedwise.menubarsearch'
    ']': '' # tell me this key is open
    h: # Previous Page
        discord: 'c.k rtn'
        raycast: 'esc'
        spotify: 'oc.lt'
        solo: 'oc.lt'
        terminal: '"cdp" ++ rtn'
        default: 'c.['
    j: hammerspoon
    k: hammerspoon
    l: hammerspoon
    ';': hammerspoon
    qt: hammerspoon
    rtn: caps
    n:
        ide: 'oc.n'
        solo: 'c.t'
        default: 'sc.n'
    m: hammerspoon
    ',': hammerspoon
    prd: hammerspoon
    '/':
    rtS:
    sb: hammerspoon

'tab : Tab':
    y:
    u:
    i: # First tab
        default: 'c.1'
    o: # Last Tab
        chrome: 'c.9'
        default: 't.0'
    p: # Pin Tab
        ide: 'c.k rtn'
        obsidian: 'toc.p'
        vivaldi: 'toc.p'
    '[': # Close all tabs to the left
        chrome: 't x h'
        ide: 'toc.e toc.['
    ']': # Close all tabs to the right
        chrome: 't x l'
        ide: 'toc.e toc.]'
    h: # Move tab left
        chrome: 'esc t h'
        ide: 'soc.lt'
        vivaldi: 'oc.lt'
    j: # Previous tab
        tableplus: 'c.['
        solo: 'c.dn'
        discord: 'o.dn' # Next conversation or channel
        tinkerwell: 'oc.lt'
        vivaldi: 'sc.]'
        warp: 'sc.]'
        default: 'sc.['
    k: # Next tab
        tableplus: 'c.]'
        solo: 'c.up'
        discord: 'o.up' # Previous conversation or channel
        tinkerwell: 'oc.rt'
        vivaldi: 'sc.['
        warp: 'sc.['
        default: 'sc.]'
    l: # Move tab right
        chrome: 'esc t l'
        ide: 'soc.rt'
        vivaldi: 'oc.rt'
    ';':
    qt:
    rtn: # Restore tab
        default: 'sc.t'
    b:
    n: # New tab
        finder: 'c.n'
        ide: 'c.n s.o'
        default: 'c.t'
    m: # Close tab
        chrome: 'hs: Tab.closeCurrent' # Hides Chrome once its last tab is gone
        default: 'c.w'
    ',': # Close the tab before
        ide: 'sc.[ c.w'
        tinkerwell: 'oc.lt c.w'
        tableplus: 'c.[ c.w c.]'
        solo: 'c.dn c.w c.up'
        discord: 'o.dn c.w o.up'
        vivaldi: 'sc.] c.w sc.['
        warp: 'sc.] c.w sc.['
        chrome: 'hs: Tab.closePrevious'
        default: 'sc.[ c.w sc.]'
    prd: # Close the tab after
        ide: 'sc.] c.w sc.['
        tableplus: 'c.] c.w'
        solo: 'c.up c.w'
        discord: 'o.up c.w'
        tinkerwell: 'oc.rt c.w'
        vivaldi: 'sc.[ c.w'
        warp: 'sc.[ c.w'
        chrome: 'hs: Tab.closeNext'
        default: 'sc.] c.w'
    '/': # Close all other tabs
        chrome: 't x ;'
        ide: 'toc.e toc./'
    rtS: # Close all tabs
        ide: 'toc.e toc.qt'
    sb: # Pin tab
        ide: 'c.k rtn'
        obsidian: 'toc.p'
        vivaldi: 'toc.p'

