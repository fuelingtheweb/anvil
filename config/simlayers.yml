'g : Git':
    y:
        terminal: '"gbc" ++ rtn'
    u:
        browser: 'oc.u'
        terminal: '"nah"'
    i:
        terminal: '"git.checkout.include-all" ++ rtn'
    o:
        terminal: '"git.checkout" ++ rtn'
    p:
        ide: 'toc.g toc.p'
        terminal: '"gd" ++ rtn'
    '[':
        ide: 'toc.g oc.['
        terminal: '"gmm" ++ rtn'
    ']':
        terminal: '"grm" ++ rtn'
    h:
        terminal: '"git.status.with-summary" ++ rtn'
    j:
        ide: 'toc.g oc.j'
        terminal: '"grs" ++ rtn'
    k:
        ide: 'toc.g oc.k'
        terminal: '"git.commit ''''" ++ lt'
    l:
        ide: 'soc.g soc.h'
        terminal: '"git.log" ++ rtn'
        vivaldi: 'sc.l'
    ';':
        terminal: '"gum" ++ rtn'
    qt:
        terminal: '"goml" ++ rtn'
    rtn:
        ide: 'toc.g oc.]'
        terminal: '"gaa" ++ rtn'
    n:
        ide: '"```suggestion" ++ rtn rtn ++ "```" ++ up'
        terminal: '"git.branch.new ''''" ++ lt'
    m:
        ide: 'toc.g toc.m'
        terminal: '"git.branch.delete" ++ rtn'
    ',':
        browser: 'oc.i'
        terminal: '"git pull" ++ rtn'
    prd:
        ide: 'toc.g toc.j'
        terminal: '"git push" ++ rtn'
    '/':
        terminal: '"git stash -u -m ''''" ++ lt'
    rtS:
        terminal: '"gstp" ++ rtn'
    sb:
        ide: 'soc.g soc.sb'

